name: Build and Release SpoofMyDevice

on:
  workflow_dispatch:

jobs:
  build:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Read APK metadata
        id: apk_metadata
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          metadata_path = Path("app/build/outputs/apk/debug/output-metadata.json")
          artifact = json.loads(metadata_path.read_text(encoding="utf-8"))["elements"][0]
          version_name = artifact["versionName"]
          apk_path = metadata_path.parent / artifact["outputFile"]
          if not isinstance(version_name, str) or not version_name or not apk_path.is_file():
              raise RuntimeError("Missing app version or generated APK.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version_name={version_name}\n")
              output.write(f"apk_path={apk_path.as_posix()}\n")
          print(f"Prepared SpoofMyDevice v{version_name}: {apk_path}")

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk_metadata.outputs.apk_path }}
          name: SpoofMyDevice v${{ steps.apk_metadata.outputs.version_name }}
          tag_name: v${{ steps.apk_metadata.outputs.version_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
